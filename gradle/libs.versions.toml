[versions]
kotlin = "2.3.21"
koog = "1.3.0"
koogBeta = "1.3.0-beta"
tamboui = "0.4.0"
coroutines = "1.10.2"
serialization = "1.10.0"
datetime = "0.7.1"
sqlite = "3.51.1.0"
mcp = "0.11.1"
slf4j = "2.0.17"
ktor = "3.4.0"

[libraries]
koog-agents      = { module = "ai.koog:koog-agents",           version.ref = "koog" }
koog-additions   = { module = "ai.koog:koog-agents-additions", version.ref = "koogBeta" }
koog-agents-cli  = { module = "ai.koog:agents-cli",            version.ref = "koogBeta" }
koog-google      = { module = "ai.koog:prompt-executor-google-client", version.ref = "koogBeta" }
koog-llms-all    = { module = "ai.koog:prompt-executor-llms-all",      version.ref = "koogBeta" }
koog-mcp         = { module = "ai.koog:agents-mcp",                    version.ref = "koogBeta" }
koog-memory      = { module = "ai.koog:agents-features-longterm-memory", version.ref = "koogBeta" }
koog-rag-vector  = { module = "ai.koog:rag-vector",                      version.ref = "koogBeta" }
koog-embeddings  = { module = "ai.koog:embeddings-llm",                  version.ref = "koog" }
koog-skills      = { module = "ai.koog:skills",                          version.ref = "koogBeta" }
koog-agents-ext  = { module = "ai.koog:agents-ext",                      version.ref = "koogBeta" }
koog-otel        = { module = "ai.koog:agents-features-opentelemetry",   version.ref = "koog" }
tamboui-toolkit  = { module = "dev.tamboui:tamboui-toolkit",       version.ref = "tamboui" }
tamboui-jline3   = { module = "dev.tamboui:tamboui-jline3-backend", version.ref = "tamboui" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
sqlite-jdbc      = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mcp-server       = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp" }
slf4j-nop        = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
slf4j-simple     = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
